<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; text-align: center; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem-vindo à Página Inicial! 🎉</h1>
        <p>Você está logado como: <strong id="user-display"></strong></p>
        <button onclick="logout()">Sair</button>
    </div>

    <script>
        // Verifica se o usuário simulou o login corretamente
        const email = localStorage.getItem('userEmail');
        if (!email) {
            window.location.href = 'login.html'; // Proteção simples de rota
        } else {
            document.getElementById('user-display').innerText = email;
        }

        function logout() {
            localStorage.removeItem('userEmail');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
