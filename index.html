<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Serverless</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 14px; }
        .link-cadastro { text-align: center; margin-top: 15px; display: block; color: #007bff; text-decoration: none; font-size: 14px; }
        .link-cadastro:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar</h2>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="password" placeholder="Senha" required>
        <button onclick="logar()">Acessar</button>
        <p id="mensagem" class="error"></p>
        <a href="https://d1306l0148ll01.cloudfront.net/cadastroUsuario.html" class="link-cadastro">Cadastrar novo usuário</a>
    </div>
    <script>
        async function logar() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensagem = document.getElementById('mensagem');
            const API_URL = 'https://0f0gnsodv8.execute-api.sa-east-1.amazonaws.com/login';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const dados = await response.json();
                if (response.status === 200) {
                    localStorage.setItem('userEmail', email);
                    window.location.href = 'https://d1306l0148ll01.cloudfront.net/home.html';
                } else {
                    mensagem.textContent = dados.message || 'Erro ao entrar.';
                }
            } catch (error) {
                mensagem.textContent = 'Erro de conexão.';
            }
        }
    </script>
</body>
</html>
